<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Quorum</title>
  <link id="appFavicon" rel="icon" type="image/png" href="/ui/icon-64.png" />
  <link rel="apple-touch-icon" href="/ui/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/ui/styles.css" />
  <link rel="stylesheet" href="/ui/panels.css" />
</head>
<body>
  <!-- 在首帧绘制前套用主题，避免深色模式启动时先闪一下浅色 -->
  <script>
    try {
      if (localStorage.getItem("agent-hub-theme") === "dark") document.body.classList.add("dark");
      if (localStorage.getItem("agent-hub-skin") === "classic") document.body.dataset.skin = "classic";
    } catch (e) {}
  </script>
  <div id="workbench" class="workbench">
    <!-- Left Sidebar: Task Groups & Session Tree -->
    <aside class="sidebar">
      <div class="brand-bar">
        <div class="brand-top">
          <div class="brand-title">
            <img class="brand-mark" src="/ui/icon-64.png" alt="" width="26" height="26" />
            <span>Quorum</span>
          </div>
          <div class="ws-status">
            <span id="portBadge" class="mono"></span>
            <span id="wsDot" class="dot"></span>
            <span id="wsText">connecting</span>
          </div>
        </div>
        <div class="cwd-row">
          <div id="cwdPill" class="cwd-line" title="当前工作目录">-</div>
          <button id="pickCwdBtn" class="mini-icon-btn cwd-pick-btn" type="button" title="查看或修改这个任务的工作目录和附加目录">目录</button>
        </div>
      </div>

      <div class="new-task-area">
        <button id="toggleNewTaskBtn" class="alma-btn alma-btn-primary new-task-main" type="button">
          新建任务
        </button>
        <div id="quickLaunchRow" class="quick-launch-row" title="一键以指定主导 Agent 启动新的并行任务">
          <button class="quick-btn" data-quick-lead="claude" type="button">+ claude</button>
          <button class="quick-btn" data-quick-lead="codex" type="button">+ codex</button>
          <button class="quick-btn" data-quick-lead="agy" type="button">+ agy</button>
        </div>

        <form id="newTaskPopover" class="new-task-popover" hidden>
          <input
            id="newTaskTitleInput"
            class="text-input"
            type="text"
            placeholder="任务名称（留空自动命名）"
            autocomplete="off"
          />
          <div class="popover-cwd-row">
            <input
              id="newTaskCwdInput"
              class="text-input"
              type="text"
              placeholder="工作目录（留空沿用当前）"
              autocomplete="off"
              list="projectChoices"
            />
            <button id="newTaskPickCwdBtn" type="button" class="alma-btn alma-btn-outline alma-btn-sm">浏览</button>
          </div>
          <datalist id="projectChoices"></datalist>
          <textarea
            id="newTaskExtraDirsInput"
            class="text-input new-task-extra-dirs"
            rows="2"
            placeholder="附加目录（可选，每行一个）"
          ></textarea>
          <div class="popover-agents" id="newTaskAgents">
            <button type="button" class="popover-agent-opt active" data-agent="claude">claude</button>
            <button type="button" class="popover-agent-opt" data-agent="codex">codex</button>
            <button type="button" class="popover-agent-opt" data-agent="agy">agy</button>
          </div>
          <div class="popover-actions">
            <button id="cancelNewTaskBtn" type="button" class="alma-btn alma-btn-sm">取消</button>
            <button type="submit" class="alma-btn alma-btn-primary alma-btn-sm">创建</button>
          </div>
        </form>
      </div>

      <div class="section-label">
        <span>任务</span>
        <span id="groupCountBadge" class="mono">0</span>
      </div>

      <div id="groupFilterBar" class="group-filter-bar">
        <input
          id="groupSearchInput"
          class="text-input group-search-input"
          type="search"
          placeholder="搜索"
          autocomplete="off"
        />
        <button id="toggleArchivedBtn" class="mini-filter-btn" type="button" title="查看或隐藏已归档任务" hidden>
          归档 0
        </button>
      </div>

      <div id="groupList" class="group-list"></div>

      <div class="sidebar-footer">
        <div id="adapterPills" class="adapter-pills">
          <span class="adapter-pill" data-adapter="claude"><span class="dot" data-auth-dot="claude"></span>claude</span>
          <span class="adapter-pill" data-adapter="codex"><span class="dot" data-auth-dot="codex"></span>codex</span>
          <span class="adapter-pill" data-adapter="agy"><span class="dot" data-auth-dot="agy"></span>agy</span>
        </div>
        <div class="footer-actions">
          <span class="kbd-hint" title="Ctrl+K 快速切换任务 · Ctrl+N 新建任务 · Esc 停止当前运行">Ctrl+K</span>
          <div class="footer-actions-right">
            <button id="settingsBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="设置（外观、Agent、日志）">设置</button>
            <button id="quitHubBtn" class="alma-btn alma-btn-danger alma-btn-sm" type="button" title="停止后台服务并关闭应用" hidden>
              退出
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Center Stage -->
    <main class="stage">
      <nav class="stage-mode-bar" aria-label="工作台视图">
        <div class="mode-tabs">
          <button class="mode-tab active" data-stage-view="chat" type="button">
            <span>对话</span>
          </button>
          <button class="mode-tab" data-stage-view="resources" type="button">
            <span>资源</span>
            <span id="navResBadge" class="mode-badge">0</span>
          </button>
          <button class="mode-tab" data-stage-view="telemetry" type="button">
            <span>用量</span>
            <span id="navTokBadge" class="mode-badge">0</span>
          </button>
          <button class="mode-tab" data-stage-view="workflow" type="button">
            <span>工作流</span>
          </button>
        </div>
        <button id="liveContextPill" class="context-pill" type="button" title="查看当前会话上下文注入与 Token 消耗">
          上下文 -
        </button>
      </nav>

      <header id="chatStageHeader" class="stage-header">
        <div class="stage-title-group">
          <h1 id="stageTaskTitle" class="stage-task-title" title="点击重命名当前任务">-</h1>
          <span id="streamBadge" class="stream-badge"></span>
        </div>

        <div class="stage-controls">
          <div id="leadSwitcher" class="lead-switcher" title="为当前任务设置或切换主导 Agent">
            <span class="lead-switch-label">主导</span>
            <button class="lead-pill" data-agent="claude" type="button">claude</button>
            <button class="lead-pill" data-agent="codex" type="button">codex</button>
            <button class="lead-pill" data-agent="agy" type="button">agy</button>
          </div>

          <button id="backToLeadBtn" class="alma-btn alma-btn-outline" type="button" hidden>
            ← 返回主导会话
          </button>

          <select id="permSelect" class="perm-select" title="工具审批策略">
            <option value="approve-all">自动批准</option>
            <option value="approve-reads">只读放行</option>
            <option value="manual">逐项确认</option>
          </select>

          <button id="exportGroupBtn" class="alma-btn alma-btn-outline" type="button" title="将当前任务对话与委派记录导出为 Markdown">
            导出
          </button>

          <button id="toggleInspectorBtn" class="alma-btn alma-btn-outline" type="button">
            面板
          </button>
        </div>
      </header>

      <div id="sessionTabs" class="session-tabs" hidden></div>

      <div id="permBanner" class="perm-banner" hidden></div>
      <div id="questionBanner" class="perm-banner question-banner" hidden></div>

      <section id="messages" class="messages"></section>

      <section id="resourcesView" class="stage-panel" hidden></section>
      <section id="telemetryView" class="stage-panel" hidden></section>
      <section id="workflowView" class="stage-panel" hidden></section>

      <footer id="chatComposerWrap" class="composer-wrap">
        <div class="alma-box composer-box">
          <span id="composerLabel" class="alma-box-label">主导会话</span>
          <span class="alma-box-corner-tl">+</span>
          <span class="alma-box-corner-tr">+</span>
          <span class="alma-box-corner-bl">+</span>
          <span class="alma-box-corner-br">+</span>
          <div id="composerAttachments" class="composer-attachments" hidden></div>
          <textarea
            id="promptInput"
            class="composer-input"
            rows="2"
            placeholder="给 Agent 发消息"
          ></textarea>
          <div class="composer-foot">
            <div class="composer-model-bar">
              <select id="modelSelect" class="perm-select model-select" title="选择当前会话 / 主导 Agent 模型"></select>
              <select id="effortSelect" class="perm-select effort-select" title="选择思考 / 推理强度" hidden></select>
              <button id="refreshModelsBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="实时握手探测并刷新该 Agent 可用模型" aria-label="刷新模型列表">↻</button>
              <input id="imageFileInput" type="file" multiple hidden />
              <button id="attachImageBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="添加图片或文件（也可以直接粘贴，或拖到输入框里）">附件</button>
            </div>
            <div class="composer-actions">
              <button id="stopSessionBtn" class="alma-btn alma-btn-danger" type="button" hidden>停止</button>
              <button id="sendBtn" class="alma-btn alma-btn-primary" type="button">发送</button>
            </div>
          </div>
        </div>
        <div id="archivedBar" class="archived-bar" hidden>
          <span>这个任务已归档，只能查看。</span>
          <button id="restoreArchivedBtn" class="alma-btn alma-btn-primary alma-btn-sm" type="button">恢复任务</button>
        </div>
        <div id="composerHint" class="composer-hint">主导会话可调用 peer_ask / peer_dispatch 委派子会话</div>
        <button id="jumpLatestBtn" class="jump-latest-btn" type="button" hidden>↓ 回到最新消息</button>
      </footer>
    </main>

    <!-- Right Inspector: everything about the session on screen -->
    <aside class="inspector">
      <div id="inspHead" class="insp-head"></div>
      <div class="insp-scroll">
        <details class="insp-sec" open>
          <summary><span>进度</span><span id="inspProgressCount" class="insp-count"></span></summary>
          <div id="inspProgress" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span>上下文</span></summary>
          <div id="inspContext" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span>子代理</span><span id="inspSessionCount" class="insp-count">0</span></summary>
          <div id="inspSessions" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span>文件</span><span id="inspFileCount" class="insp-count">0</span></summary>
          <div id="inspFiles" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span>产物</span><span id="inspArtifactCount" class="insp-count">0</span></summary>
          <div id="inspArtifacts" class="insp-body"></div>
        </details>
      </div>
    </aside>
  </div>

  <!-- Settings dialog: appearance, general, agents, log -->
  <div id="settingsBackdrop" class="alma-modal-backdrop settings-backdrop" hidden>
    <div class="settings-dialog" role="dialog" aria-modal="true" aria-label="设置">
      <nav class="settings-nav" aria-label="设置分类">
        <div class="settings-nav-title">设置</div>
        <button type="button" data-settings-tab="general" class="active">通用</button>
        <button type="button" data-settings-tab="agents">Agent <span id="navAgentsBadge" class="mode-badge">5</span></button>
        <button type="button" data-settings-tab="logs">日志</button>
      </nav>
      <div class="settings-main">
        <button id="settingsCloseBtn" class="settings-close" type="button" aria-label="关闭设置">×</button>
        <section class="settings-pane" data-settings-pane="general">
          <h2>通用</h2>
          <div class="settings-row">
            <div>
              <div class="settings-label">风格</div>
              <div class="settings-note">经典是原来的米色背景和方角框线。</div>
            </div>
            <div class="settings-seg" id="skinSeg">
              <button type="button" data-skin="modern">简约</button>
              <button type="button" data-skin="classic">经典</button>
            </div>
          </div>
          <div class="settings-row">
            <div class="settings-label">主题</div>
            <button id="themeToggleBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="切换浅色 / 深色主题">
              深色
            </button>
          </div>
          <label class="settings-row">
            <div>
              <div class="settings-label">自动命名任务</div>
              <div class="settings-note">首轮对话结束时由主导 Agent 为任务起一个短标题。</div>
            </div>
            <input id="autoTitleToggle" type="checkbox" />
          </label>
        </section>
        <section class="settings-pane" data-settings-pane="agents" hidden>
          <h2>Agent</h2>
          <section id="agentsView" class="settings-agents"></section>
        </section>
        <section class="settings-pane" data-settings-pane="logs" hidden>
          <h2>日志</h2>
          <div id="logFeed" class="log-feed"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- In-App Dialog Modal (replaces native prompt / confirm) -->
  <div id="appModalBackdrop" class="alma-modal-backdrop" hidden>
    <div class="alma-box alma-modal-card" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
      <span id="appModalCornerTag" class="alma-box-label">dialog</span>
      <span class="alma-box-corner-tl">+</span>
      <span class="alma-box-corner-tr">+</span>
      <span class="alma-box-corner-bl">+</span>
      <span class="alma-box-corner-br">+</span>
      <h3 id="appModalTitle" class="alma-modal-title">确认操作</h3>
      <p id="appModalMessage" class="alma-modal-msg" hidden></p>
      <input id="appModalInput" class="text-input alma-modal-input" type="text" autocomplete="off" hidden />
      <div class="alma-modal-actions">
        <button id="appModalCancelBtn" type="button" class="alma-btn">取消</button>
        <button id="appModalConfirmBtn" type="button" class="alma-btn alma-btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- Quick Task & Command Switcher (Ctrl+K) -->
  <div id="quickSwitcherBackdrop" class="alma-modal-backdrop" hidden>
    <div class="alma-box quick-switcher-card" role="dialog" aria-modal="true" aria-label="快速切换任务与命令">
      <span class="alma-box-label">ctrl+k</span>
      <span class="alma-box-corner-tl">+</span>
      <span class="alma-box-corner-tr">+</span>
      <span class="alma-box-corner-bl">+</span>
      <span class="alma-box-corner-br">+</span>
      <input
        id="quickSwitcherInput"
        class="text-input qs-input"
        type="text"
        placeholder="输入任务名、子会话或操作（如：新建、导出、归档）..."
        autocomplete="off"
      />
      <div id="quickSwitcherList" class="qs-list"></div>
      <div class="qs-foot mono">
        <span>↑↓ 选择</span>
        <span>Enter 确认</span>
        <span>Esc 关闭</span>
      </div>
    </div>
  </div>

  <script type="module" src="/ui/app.js"></script>
  <script type="module" src="/ui/panels.js"></script>
  <script type="module" src="/ui/interactive.js"></script>
</body>
</html>
