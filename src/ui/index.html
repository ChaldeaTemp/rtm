<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Hub — 多 Agent 任务协同台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <div id="workbench" class="workbench">
    <!-- Left Sidebar: Task Groups & Session Tree -->
    <aside class="sidebar">
      <div class="brand-bar">
        <div class="brand-top">
          <div class="brand-title">
            <span class="brand-mark">A</span>
            <span>agent-hub</span>
          </div>
          <div class="ws-status">
            <span id="wsDot" class="dot"></span>
            <span id="wsText">connecting</span>
          </div>
        </div>
        <div id="cwdPill" class="cwd-line" title="">-</div>
      </div>

      <div class="new-task-area">
        <button id="toggleNewTaskBtn" class="alma-btn alma-btn-primary new-task-main" type="button">
          + 新建并行任务
        </button>
        <div class="quick-launch-row" title="一键以指定主导 Agent 启动新的并行任务">
          <button class="quick-btn" data-quick-lead="claude" type="button">+ claude</button>
          <button class="quick-btn" data-quick-lead="codex" type="button">+ codex</button>
          <button class="quick-btn" data-quick-lead="agy" type="button">+ agy</button>
        </div>

        <form id="newTaskPopover" class="new-task-popover" hidden>
          <input
            id="newTaskTitleInput"
            class="text-input"
            type="text"
            placeholder="任务名称（留空自动命名）"
            autocomplete="off"
          />
          <div class="popover-agents" id="newTaskAgents">
            <button type="button" class="popover-agent-opt active" data-agent="claude">claude</button>
            <button type="button" class="popover-agent-opt" data-agent="codex">codex</button>
            <button type="button" class="popover-agent-opt" data-agent="agy">agy</button>
          </div>
          <div class="popover-actions">
            <button id="cancelNewTaskBtn" type="button" class="alma-btn alma-btn-sm">取消</button>
            <button type="submit" class="alma-btn alma-btn-primary alma-btn-sm">创建</button>
          </div>
        </form>
      </div>

      <div class="section-label">
        <span><span class="num">01</span>/ 任务分组</span>
        <span id="groupCountBadge" class="mono">0</span>
      </div>

      <div id="groupList" class="group-list"></div>

      <div class="sidebar-footer">
        <div id="adapterPills" class="adapter-pills">
          <span class="adapter-pill" data-adapter="claude"><span class="dot" data-auth-dot="claude"></span>claude</span>
          <span class="adapter-pill" data-adapter="codex"><span class="dot" data-auth-dot="codex"></span>codex</span>
          <span class="adapter-pill" data-adapter="agy"><span class="dot" data-auth-dot="agy"></span>agy</span>
        </div>
        <button id="themeToggleBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="切换浅色 / 深色主题">
          深色
        </button>
      </div>
    </aside>

    <!-- Center Stage -->
    <main class="stage">
      <header class="stage-header">
        <div class="stage-title-group">
          <h1 id="stageTaskTitle" class="stage-task-title" title="点击重命名当前任务">-</h1>
          <span id="streamBadge" class="stream-badge">主导会话</span>
        </div>

        <div class="stage-controls">
          <div id="leadSwitcher" class="lead-switcher" title="为当前任务设置或切换主导 Agent">
            <span class="lead-switch-label">主导</span>
            <button class="lead-pill" data-agent="claude" type="button">claude</button>
            <button class="lead-pill" data-agent="codex" type="button">codex</button>
            <button class="lead-pill" data-agent="agy" type="button">agy</button>
          </div>

          <button id="backToLeadBtn" class="alma-btn alma-btn-outline" type="button" hidden>
            ← 返回主导会话
          </button>

          <select id="permSelect" class="perm-select" title="工具审批策略">
            <option value="approve-all">权限：自动批准</option>
            <option value="approve-reads">权限：仅只读放行</option>
            <option value="manual">权限：全部人工确认</option>
          </select>

          <button id="toggleInspectorBtn" class="alma-btn alma-btn-outline" type="button">
            面板
          </button>
        </div>
      </header>

      <div id="sessionTabs" class="session-tabs" hidden></div>

      <div id="permBanner" class="perm-banner" hidden></div>

      <section id="messages" class="messages"></section>

      <footer class="composer-wrap">
        <div class="alma-box composer-box">
          <span id="composerLabel" class="alma-box-label">主导会话</span>
          <span class="alma-box-corner-tl">+</span>
          <span class="alma-box-corner-tr">+</span>
          <span class="alma-box-corner-bl">+</span>
          <span class="alma-box-corner-br">+</span>
          <textarea
            id="promptInput"
            class="composer-input"
            rows="2"
            placeholder="输入任务指令，Enter 发送，Shift+Enter 换行；当前任务与其它并行任务互不阻塞。"
          ></textarea>
          <div class="composer-foot">
            <span id="composerHint" class="composer-hint">主导会话可调用 peer_ask / peer_dispatch 委派子会话</span>
            <div class="composer-actions">
              <button id="stopSessionBtn" class="alma-btn alma-btn-danger" type="button" hidden>停止</button>
              <button id="sendBtn" class="alma-btn alma-btn-primary" type="button">发送 ↵</button>
            </div>
          </div>
        </div>
      </footer>
    </main>

    <!-- Right Inspector -->
    <aside class="inspector">
      <div class="inspector-section sessions-sec">
        <div class="section-label">
          <span><span class="num">01</span>/ 当前任务会话</span>
          <span id="inspSessionCount" class="mono">0</span>
        </div>
        <div id="inspSessions" class="inspector-list"></div>
      </div>

      <div class="inspector-section tasks-sec">
        <div class="section-label">
          <span><span class="num">02</span>/ 协同委派记录</span>
          <span id="inspTaskCount" class="mono">0</span>
        </div>
        <div id="inspTasks" class="inspector-list"></div>
      </div>

      <div class="inspector-section logs-sec">
        <div class="section-label">
          <span><span class="num">03</span>/ 事件日志</span>
        </div>
        <div id="logFeed" class="log-feed"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>
