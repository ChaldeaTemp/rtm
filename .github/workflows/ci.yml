name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Windows only for now: it is the platform RTM is developed and tested on.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and mock-agent regressions
        run: npm run verify:mock
