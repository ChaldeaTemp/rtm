<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>RoundTable Meeting</title>
  <link id="appFavicon" rel="icon" type="image/png" href="/ui/icon-64.png" />
  <link rel="apple-touch-icon" href="/ui/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/ui/styles.css" />
  <link rel="stylesheet" href="/ui/panels.css" />
  <link rel="stylesheet" href="/ui/board.css" />
</head>
<body data-screen="board">
  <!-- 在首帧绘制前套用主题，避免深色模式启动时先闪一下浅色 -->
  <script>
    try {
      if (localStorage.getItem("agent-hub-theme") === "dark") document.body.classList.add("dark");
      var savedSkin = localStorage.getItem("agent-hub-skin");
      if (savedSkin === "classic" || savedSkin === "roundtable") document.body.dataset.skin = savedSkin;
      var sp = new URLSearchParams(location.search);
      document.body.dataset.screen = (sp.get("view") === "workbench" || sp.get("group")) ? "workbench" : "board";
    } catch (e) {}
  </script>
  <section id="boardScreen" class="board-screen" hidden></section>
  <div id="workbench" class="workbench">
    <!-- Left Sidebar: Task Groups & Session Tree -->
    <aside class="sidebar">
      <div class="brand-bar">
        <div class="brand-top">
          <div id="brandHomeBtn" class="brand-title" role="button" tabindex="0" title="返回任务看板" data-i18n-title="backToBoard">
            <img class="brand-mark" src="/ui/icon-64.png" alt="" width="22" height="22" />
            <span>RoundTable Meeting</span>
          </div>
          <div class="ws-status">
            <span id="portBadge" class="mono"></span>
            <span id="wsDot" class="dot" title="WebSocket 连接状态" data-i18n-title="websocketStatus"></span>
          </div>
        </div>
        <div class="cwd-row">
          <div id="cwdPill" class="cwd-line" title="当前工作目录" data-i18n-title="currentWorkingDirectory">-</div>
          <button id="pickCwdBtn" class="mini-icon-btn cwd-pick-btn" type="button" title="查看或修改这个任务的工作目录和附加目录" data-i18n-title="viewOrEditThisTasksWorkingDirectory" data-i18n="directories">目录</button>
        </div>
      </div>

      <div class="new-task-area">
        <div class="new-task-top-row">
          <button id="openBoardBtn" class="alma-btn alma-btn-outline open-board-btn" type="button" title="返回任务看板" data-i18n-title="backToBoard">
            <span data-i18n="taskBoard">任务看板</span>
            <span id="openBoardBadge" class="mode-badge" hidden>0</span>
          </button>
          <button id="toggleNewTaskBtn" class="alma-btn alma-btn-primary new-task-main" type="button" data-i18n="newTask">
            新建任务
          </button>
        </div>

        <form id="newTaskPopover" class="new-task-popover" hidden>
          <input
            id="newTaskTitleInput"
            class="text-input"
            type="text"
            placeholder="任务名称（留空自动命名）"
            autocomplete="off" data-i18n-placeholder="taskNameLeaveBlankToNameAutomatically" />
          <div class="popover-cwd-row">
            <input
              id="newTaskCwdInput"
              class="text-input"
              type="text"
              placeholder="工作目录（留空沿用当前）"
              autocomplete="off"
              list="projectChoices" data-i18n-placeholder="workingDirectoryLeaveBlankToUseThe" />
            <button id="newTaskPickCwdBtn" type="button" class="alma-btn alma-btn-outline alma-btn-sm" data-i18n="browse">浏览</button>
          </div>
          <datalist id="projectChoices"></datalist>
          <textarea
            id="newTaskExtraDirsInput"
            class="text-input new-task-extra-dirs"
            rows="2"
            placeholder="附加目录（可选，每行一个）" data-i18n-placeholder="additionalDirectoriesOptionalOnePerLine"></textarea>
          <div class="popover-agents" id="newTaskAgents">
            <button type="button" class="popover-agent-opt active" data-agent="claude">claude</button>
            <button type="button" class="popover-agent-opt" data-agent="codex">codex</button>
            <button type="button" class="popover-agent-opt" data-agent="agy">agy</button>
          </div>
          <div class="popover-actions">
            <button id="cancelNewTaskBtn" type="button" class="alma-btn alma-btn-sm" data-i18n="cancel">取消</button>
            <button type="submit" class="alma-btn alma-btn-primary alma-btn-sm" data-i18n="create">创建</button>
          </div>
        </form>
      </div>

      <div class="section-label">
        <span data-i18n="tasks">任务</span>
        <span id="groupCountBadge" class="mono">0</span>
      </div>

      <div id="groupFilterBar" class="group-filter-bar">
        <input
          id="groupSearchInput"
          class="text-input group-search-input"
          type="search"
          placeholder="搜索"
          autocomplete="off" data-i18n-placeholder="search" />
        <button id="toggleArchivedBtn" class="mini-filter-btn" type="button" title="查看或隐藏已归档任务" hidden data-i18n-title="showOrHideArchivedTasks" data-i18n="archivedInitial">
          归档 0
        </button>
      </div>

      <div id="groupList" class="group-list"></div>

      <div class="sidebar-footer">
        <div class="footer-actions">
          <span class="kbd-hint" title="Ctrl+K 快速切换任务 · Ctrl+N 新建任务 · Esc 停止当前运行" data-i18n-title="ctrlKSwitchTasksCtrlNNew">Ctrl+K</span>
          <div class="footer-actions-right">
            <button id="settingsBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="设置（外观、Agent、资源、日志）" data-i18n-title="settingsAppearanceAgentsResourcesLogs" data-i18n="settings">设置</button>
            <button id="quitHubBtn" class="alma-btn alma-btn-danger alma-btn-sm" type="button" title="停止后台服务并关闭应用" hidden data-i18n-title="stopTheBackgroundServiceAndCloseThe" data-i18n="quit">
              退出
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Center Stage -->
    <main class="stage">
      <nav class="stage-mode-bar" aria-label="工作台视图" data-i18n-aria-label="workbenchViews">
        <div class="mode-tabs">
          <button class="mode-tab active" data-stage-view="chat" type="button">
            <span data-i18n="chat">对话</span>
          </button>
          <button class="mode-tab" data-stage-view="workflow" type="button">
            <span data-i18n="workflow">工作流</span>
          </button>
          <button class="mode-tab" data-stage-view="telemetry" type="button">
            <span data-i18n="usage">用量</span>
            <span id="navTokBadge" class="mode-badge">0</span>
          </button>
        </div>
        <div class="stage-mode-actions">
          <select id="pendingRequestSelect" class="perm-select" hidden></select>
          <button id="liveContextPill" class="context-pill" type="button" title="查看当前会话上下文注入与 Token 消耗" data-i18n-title="viewContextAndTokenUsageForThe" data-i18n="contextInitial">
            上下文 -
          </button>
        </div>
      </nav>

      <header id="chatStageHeader" class="stage-header">
        <div class="stage-title-group">
          <h1 id="stageTaskTitle" class="stage-task-title" title="点击重命名当前任务" data-i18n-title="clickToRenameTheCurrentTask">-</h1>
          <span id="streamBadge" class="stream-badge"></span>
        </div>

        <div class="stage-controls">
          <div id="leadSwitcher" class="lead-switcher">
            <span class="lead-switch-label" data-i18n="lead">主导</span>
          </div>

          <button id="backToLeadBtn" class="alma-btn alma-btn-outline" type="button" hidden data-i18n="backToLeadSession">
            ← 返回主导会话
          </button>

          <select id="permSelect" class="perm-select" title="工具审批策略" data-i18n-title="toolApprovalPolicy">
            <option value="approve-all" data-i18n="approveAll">自动批准</option>
            <option value="approve-reads" data-i18n="approveReadOnlyActions">只读放行</option>
            <option value="manual" data-i18n="manualApproval">逐项确认</option>
          </select>

          <button id="exportGroupBtn" class="alma-btn alma-btn-outline" type="button" title="将当前任务对话与委派记录导出为 Markdown" data-i18n-title="exportThisTasksConversationAndDelegationHistory" data-i18n="export">
            导出
          </button>

          <button id="toggleInspectorBtn" class="alma-btn alma-btn-outline" type="button" data-i18n="inspector">
            面板
          </button>
        </div>
      </header>

      <div id="sessionTabs" class="session-tabs" hidden></div>

      <div id="permBanner" class="perm-banner" hidden></div>
      <div id="questionBanner" class="perm-banner question-banner" hidden></div>
      <div id="boardResumeBanner" class="perm-banner perm-row" hidden>
        <span data-i18n="boardWaitInterrupted">重启中断，待继续</span>
        <button id="boardResumeBtn" class="alma-btn alma-btn-primary alma-btn-sm" type="button" data-i18n="boardActionResume">继续</button>
      </div>

      <section id="messages" class="messages"></section>

      <section id="telemetryView" class="stage-panel" hidden></section>
      <section id="workflowView" class="stage-panel" hidden></section>

      <footer id="chatComposerWrap" class="composer-wrap">
        <div class="alma-box composer-box">
          <span id="composerLabel" class="alma-box-label" data-i18n="leadSession">主导会话</span>
          <span class="alma-box-corner-tl">+</span>
          <span class="alma-box-corner-tr">+</span>
          <span class="alma-box-corner-bl">+</span>
          <span class="alma-box-corner-br">+</span>
          <div id="composerSuggest" class="composer-suggest" hidden></div>
          <div id="composerQueue" class="composer-queue" hidden></div>
          <div id="composerAttachments" class="composer-attachments" hidden></div>
          <textarea
            id="promptInput"
            class="composer-input"
            rows="2"
            placeholder="给 Agent 发消息（输入 / 查命令，@ 引用文件）" data-i18n-placeholder="messageTheAgentForCommandsForFiles"></textarea>
          <div class="composer-foot">
            <div class="composer-model-bar">
              <select id="modelSelect" class="perm-select model-select" title="选择当前会话 / 主导 Agent 模型" data-i18n-title="selectTheModelForTheCurrentSession"></select>
              <select id="effortSelect" class="perm-select effort-select" title="选择思考 / 推理强度" hidden data-i18n-title="selectReasoningEffort"></select>
              <button id="refreshModelsBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="实时握手探测并刷新该 Agent 可用模型" aria-label="刷新模型列表" data-i18n-title="refreshModelsByConnectingToThisAgent" data-i18n-aria-label="refreshModelList">↻</button>
              <input id="imageFileInput" type="file" multiple hidden />
              <button id="attachImageBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="添加图片或文件（也可以直接粘贴，或拖到输入框里）" data-i18n-title="attachImagesOrFilesByBrowsingPasting" data-i18n="attach">附件</button>
            </div>
            <div class="composer-actions">
              <span class="composer-kbd-hint" data-i18n="enterToSendShiftEnterForA">Enter 发送 · Shift+Enter 换行</span>
              <button id="stopSessionBtn" class="alma-btn alma-btn-danger" type="button" hidden data-i18n="stop">停止</button>
              <button id="steerBtn" class="alma-btn alma-btn-outline" type="button" hidden title="打断当前这一轮，让 Agent 按这条消息调整后继续（Ctrl+Enter）" data-i18n-title="interruptThisTurnAndSteerTheAgent" data-i18n="steer">引导</button>
              <button id="sendBtn" class="alma-btn alma-btn-primary" type="button" data-i18n="send">发送</button>
            </div>
          </div>
        </div>
        <div id="archivedBar" class="archived-bar" hidden>
          <span data-i18n="thisTaskIsArchivedAndReadOnly">这个任务已归档，只能查看。</span>
          <button id="restoreArchivedBtn" class="alma-btn alma-btn-primary alma-btn-sm" type="button" data-i18n="restoreTask">恢复任务</button>
        </div>
        <button id="jumpLatestBtn" class="jump-latest-btn" type="button" hidden data-i18n="jumpToLatest">↓ 回到最新消息</button>
      </footer>
    </main>

    <div id="inspectorBackdrop" class="inspector-backdrop" hidden></div>
    <!-- Right Inspector: everything about the session on screen -->
    <aside class="inspector">
      <div id="inspHead" class="insp-head"></div>
      <div class="insp-scroll">
        <details class="insp-sec" open>
          <summary><span data-i18n="progress">进度</span><span id="inspProgressCount" class="insp-count"></span></summary>
          <div id="inspProgress" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span data-i18n="context">上下文</span></summary>
          <div id="inspContext" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span data-i18n="subagents">子代理</span><span id="inspSessionCount" class="insp-count">0</span></summary>
          <div id="inspSessions" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span data-i18n="files">文件</span><span id="inspFileCount" class="insp-count">0</span></summary>
          <div id="inspFiles" class="insp-body"></div>
        </details>
        <details class="insp-sec" open>
          <summary><span data-i18n="artifacts">产物</span><span id="inspArtifactCount" class="insp-count">0</span></summary>
          <div id="inspArtifacts" class="insp-body"></div>
        </details>
      </div>
    </aside>
  </div>

  <!-- Settings dialog: appearance, general, agents, log -->
  <div id="settingsBackdrop" class="alma-modal-backdrop settings-backdrop" hidden>
    <div class="settings-dialog" role="dialog" aria-modal="true" aria-label="设置" data-i18n-aria-label="settings">
      <nav class="settings-nav" aria-label="设置分类" data-i18n-aria-label="settingsCategories">
        <div class="settings-nav-title" data-i18n="settings">设置</div>
        <button type="button" data-settings-tab="general" class="active" data-i18n="general">通用</button>
        <button type="button" data-settings-tab="agents">Agent <span id="navAgentsBadge" class="mode-badge">5</span></button>
        <button type="button" data-settings-tab="resources"><span data-i18n="resources">资源</span> <span id="navResBadge" class="mode-badge">0</span></button>
        <button type="button" data-settings-tab="mcp">MCP</button>
        <button type="button" data-settings-tab="logs" data-i18n="logs">日志</button>
      </nav>
      <div class="settings-main">
        <button id="settingsCloseBtn" class="settings-close" type="button" aria-label="关闭设置" data-i18n-aria-label="closeSettings">×</button>
        <section class="settings-pane" data-settings-pane="general">
          <h2 data-i18n="general">通用</h2>
          <label class="settings-row">
            <span class="settings-label" data-i18n="language">语言</span>
            <select id="languageSelect" class="perm-select">
              <option value="" data-i18n="browserLanguage">跟随浏览器</option>
              <option value="zh-CN" lang="zh-CN">简体中文</option>
              <option value="en" lang="en">English</option>
            </select>
          </label>
          <div class="settings-row">
            <div>
              <div class="settings-label" data-i18n="style">风格</div>
              <div class="settings-note" data-i18n="classicUsesABeigeBackgroundWithSquare">经典是原来的米色背景和方角框线；圆桌是深蓝配金线，配深色主题最好看。</div>
            </div>
            <div class="settings-seg" id="skinSeg">
              <button type="button" data-skin="modern" data-i18n="minimal">简约</button>
              <button type="button" data-skin="classic" data-i18n="classic">经典</button>
              <button type="button" data-skin="roundtable" data-i18n="roundtable">圆桌</button>
            </div>
          </div>
          <div class="settings-row">
            <div class="settings-label" data-i18n="theme">主题</div>
            <button id="themeToggleBtn" class="alma-btn alma-btn-outline alma-btn-sm" type="button" title="切换浅色 / 深色主题" data-i18n-title="switchBetweenLightAndDarkThemes" data-i18n="dark">
              深色
            </button>
          </div>
          <label class="settings-row">
            <div>
              <div class="settings-label" data-i18n="nameTasksAutomatically">自动命名任务</div>
              <div class="settings-note" data-i18n="afterTheFirstTurnTheLeadAgent">首轮对话结束时由主导 Agent 为任务起一个短标题。</div>
            </div>
            <input id="autoTitleToggle" type="checkbox" />
          </label>
          <label class="settings-row">
            <div>
              <div class="settings-label" data-i18n="concurrentBoardTasks">看板同时运行的任务数</div>
              <div class="settings-note" data-i18n="concurrentBoardTasksNote">超过上限的看板任务会自动排队；进入“等你”的任务立即让出名额。</div>
            </div>
            <select id="boardParallelSelect" class="perm-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="6">6</option>
              <option value="8">8</option>
            </select>
          </label>
          <label class="settings-row">
            <div>
              <div class="settings-label" data-i18n="concurrentWorkflowSteps">工作流同时运行的步骤数</div>
              <div class="settings-note" data-i18n="eachRunningStepStartsItsOwnAgent">每个运行中的步骤都是一组 Agent 进程，开得太多会把内存占满。其余步骤排队等空位。</div>
            </div>
            <select id="workflowParallelSelect" class="perm-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="6">6</option>
              <option value="8">8</option>
            </select>
          </label>
          <label class="settings-row">
            <div>
              <div class="settings-label" data-i18n="putIdleLeadsToSleep">空闲主导会话自动休眠</div>
              <div class="settings-note" data-i18n="putIdleLeadsToSleepNote">默认从不休眠以保留主导上下文；内存吃紧时超过 10 分钟空闲会自动休眠。</div>
            </div>
            <select id="idleLeadSelect" class="perm-select">
              <option value="0" data-i18n="never">从不</option>
              <option value="10" data-i18n="label10Minutes">10 分钟</option>
              <option value="30" data-i18n="label30Minutes">30 分钟</option>
              <option value="60" data-i18n="label1Hour">1 小时</option>
            </select>
          </label>
          <label class="settings-row">
            <div>
              <div class="settings-label" data-i18n="putIdleSubsessionsToSleep">空闲子会话自动休眠</div>
              <div class="settings-note" data-i18n="releaseSubsessionAgentProcessesAfterThisPeriod">子会话空闲超过这个时间就释放它的 Agent 进程（每个占几百 MB）。再发消息会自动唤醒，并带回之前的对话。主导会话不受影响。</div>
            </div>
            <select id="idleSubSessionSelect" class="perm-select">
              <option value="0" data-i18n="never">从不</option>
              <option value="5" data-i18n="label5Minutes">5 分钟</option>
              <option value="15" data-i18n="label15Minutes">15 分钟</option>
              <option value="30" data-i18n="label30Minutes">30 分钟</option>
              <option value="60" data-i18n="label1Hour">1 小时</option>
            </select>
          </label>
        </section>
        <section class="settings-pane" data-settings-pane="agents" hidden>
          <h2>Agent</h2>
          <section id="agentsView" class="settings-agents"></section>
        </section>
        <section class="settings-pane settings-pane-resources" data-settings-pane="resources" hidden>
          <h2 data-i18n="resources">资源</h2>
          <section id="resourcesView" class="settings-resources"></section>
        </section>
        <section class="settings-pane" data-settings-pane="mcp" hidden>
          <h2 data-i18n="mcpSharedServers">共享 MCP 服务</h2>
          <section id="mcpView"></section>
        </section>
        <section class="settings-pane" data-settings-pane="logs" hidden>
          <h2 data-i18n="logs">日志</h2>
          <div id="logFeed" class="log-feed"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- In-App Dialog Modal (replaces native prompt / confirm) -->
  <div id="appModalBackdrop" class="alma-modal-backdrop" hidden>
    <div class="alma-box alma-modal-card" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
      <span id="appModalCornerTag" class="alma-box-label">dialog</span>
      <span class="alma-box-corner-tl">+</span>
      <span class="alma-box-corner-tr">+</span>
      <span class="alma-box-corner-bl">+</span>
      <span class="alma-box-corner-br">+</span>
      <h3 id="appModalTitle" class="alma-modal-title" data-i18n="confirmAction">确认操作</h3>
      <p id="appModalMessage" class="alma-modal-msg" hidden></p>
      <input id="appModalInput" class="text-input alma-modal-input" type="text" autocomplete="off" hidden />
      <div class="alma-modal-actions">
        <button id="appModalCancelBtn" type="button" class="alma-btn" data-i18n="cancel">取消</button>
        <button id="appModalConfirmBtn" type="button" class="alma-btn alma-btn-primary" data-i18n="confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- Quick Task & Command Switcher (Ctrl+K) -->
  <div id="quickSwitcherBackdrop" class="alma-modal-backdrop" hidden>
    <div class="alma-box quick-switcher-card" role="dialog" aria-modal="true" aria-label="快速切换任务与命令" data-i18n-aria-label="quickTaskAndCommandSwitcher">
      <span class="alma-box-label">ctrl+k</span>
      <span class="alma-box-corner-tl">+</span>
      <span class="alma-box-corner-tr">+</span>
      <span class="alma-box-corner-bl">+</span>
      <span class="alma-box-corner-br">+</span>
      <input
        id="quickSwitcherInput"
        class="text-input qs-input"
        type="text"
        placeholder="输入任务名、子会话或操作（如：新建、导出、归档）..."
        autocomplete="off" data-i18n-placeholder="searchTasksSubsessionsOrCommandsEG" />
      <div id="quickSwitcherList" class="qs-list"></div>
      <div class="qs-foot mono">
